<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alankritha's Portfolio</title>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background-color: #f3f4f6;
      color: #1f2937;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow-x: hidden;
    }

    /* --- TechText --- */
    .tech-text {
      position: relative;
      width: 100%;
      height: 100%;
      touch-action: pan-y;
      user-select: none;
    }
    .tech-text-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* --- GlassIcons --- */
    .glass-icons-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 48px;
      justify-items: center;
      max-width: 680px;
      margin: 0 auto;
      padding: 24px 0;
    }

    .glass-icon-btn {
      position: relative;
      width: 96px;
      height: 96px;
      border: none;
      background: transparent;
      cursor: pointer;
      padding: 0;
      outline: none;
      perspective: 800px;
      animation: iconEntrance 0.6s cubic-bezier(0.22, 1, 0.36, 1) backwards;
    }

    @keyframes iconEntrance {
      from { opacity: 0; transform: translateY(18px) scale(0.9); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .glass-icon-plate {
      position: absolute;
      inset: 0;
      border-radius: 24px;
      transform: rotate(24deg) translate(4px, -4px);
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.35s ease;
      box-shadow: 0 12px 24px -6px rgba(0, 0, 0, 0.18);
    }

    .glass-icon-pane {
      position: absolute;
      inset: 0;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.48);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1.5px solid rgba(255, 255, 255, 0.85);
      box-shadow:
        inset 0 1px 1px rgba(255, 255, 255, 0.9),
        inset 0 -2px 6px rgba(0, 0, 0, 0.06),
        0 8px 20px rgba(0, 0, 0, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .glass-icon-pane svg {
      width: 36px;
      height: 36px;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.18));
    }

    .glass-icon-btn:hover .glass-icon-plate {
      transform: rotate(32deg) translate(8px, -8px) scale(1.04);
    }
    .glass-icon-btn:hover .glass-icon-pane {
      transform: translateY(-3px) scale(1.02);
    }
    .glass-icon-btn:active .glass-icon-pane {
      transform: scale(0.93);
    }

    .glass-icon-label {
      position: absolute;
      top: calc(100% + 16px);
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
      font-size: 0.92rem;
      font-weight: 600;
      color: #374151;
      letter-spacing: -0.01em;
      transition: color 0.2s ease, transform 0.2s ease;
    }
    .glass-icon-btn:hover .glass-icon-label {
      color: #7c3aed;
      transform: translateX(-50%) translateY(2px);
    }

    /* --- LineSidebar --- */
    .line-sidebar {
      --accent-color: #7c3aed;
      --text-color: #6b7280;
      --marker-color: #9ca3af;
      --marker-length: 48px;
      --marker-gap: 8px;
      --tick-scale: 0.5;
      --max-shift: 24px;
      --item-gap: 22px;
      --font-size: 1.05rem;
      --smoothing: 100ms;

      position: relative;
      display: flex;
      justify-content: flex-start;
    }
    .line-sidebar--markers {
      padding-left: calc(var(--marker-length) + var(--marker-gap));
    }
    .line-sidebar__list {
      list-style: none;
      margin: 0;
      padding: 0.5rem 0;
      display: flex;
      flex-direction: column;
      gap: var(--item-gap);
    }
    .line-sidebar__item {
      position: relative;
      cursor: pointer;
    }
    .line-sidebar__item::before {
      content: '';
      position: absolute;
      inset: -6px -48px;
    }
    .line-sidebar__label {
      position: relative;
      display: inline-flex;
      align-items: baseline;
      font-size: var(--font-size);
      line-height: 1.2;
      font-weight: 500;
      color: color-mix(in srgb, var(--accent-color) calc(var(--effect, 0) * 100%), var(--text-color));
      transform: translateX(calc(var(--effect, 0) * var(--max-shift)));
    }
    .line-sidebar__index {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      margin-right: 0.6rem;
      font-size: 0.85em;
      opacity: calc(0.55 + var(--effect, 0) * 0.45);
    }
    .line-sidebar__marker {
      position: absolute;
      top: 50%;
      left: calc(-1 * var(--marker-length) - var(--marker-gap));
      height: 1px;
      width: var(--marker-length);
      background-color: color-mix(in srgb, var(--accent-color) calc(var(--effect, 0) * 100%), var(--marker-color));
      transform-origin: left center;
      transform: translateY(-50%) scaleX(calc(0.7 + var(--effect, 0) * 0.5));
    }
    .line-sidebar--markers .line-sidebar__item:not(:last-child)::after {
      content: '';
      position: absolute;
      top: calc(100% + var(--item-gap) / 2);
      left: calc(-1 * var(--marker-length) - var(--marker-gap));
      height: 1px;
      width: calc(var(--marker-length) * var(--tick-scale));
      background-color: var(--marker-color);
      opacity: 0.5;
      transform: translateY(-50%);
    }
    .line-sidebar--scale-tick .line-sidebar__item:not(:last-child)::after {
      transform-origin: left center;
      transform: translateY(-50%) scaleX(calc(0.7 + var(--effect, 0) * 0.6));
    }

    /* --- Layout & Animated List --- */
    .portfolio-shell {
      min-height: 100vh;
      max-width: 1120px;
      margin: 0 auto;
      padding: 20px 32px 80px;
      display: flex;
      flex-direction: column;
    }

    .home-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding-bottom: 48px;
    }
    .home-hero {
      width: 100%;
      height: 150px;
      margin-bottom: 8px;
    }
    .home-hint {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.88rem;
      color: #6b7280;
      margin-bottom: 36px;
      letter-spacing: 0.02em;
      text-align: center;
    }

    .compact-header {
      width: 100%;
      height: 100px;
      margin-bottom: 24px;
      border-bottom: 1px solid #e5e7eb;
    }
    .workspace-layout {
      display: grid;
      grid-template-columns: 270px 1fr;
      gap: 56px;
      align-items: start;
    }
    .sidebar-column {
      position: sticky;
      top: 36px;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #e5e7eb;
      border: none;
      color: #374151;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 24px;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .back-btn:hover {
      background: #d1d5db;
      color: #111827;
    }

    .section-header {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 28px;
      padding-bottom: 12px;
      border-bottom: 1px solid #d1d5db;
    }
    .section-index {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.9rem;
      color: #7c3aed;
      font-weight: 600;
    }
    .section-title {
      margin: 0;
      font-size: 1.6rem;
      font-weight: 700;
      color: #111827;
    }

    @keyframes listSlideIn {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .animated-item {
      animation: listSlideIn 0.45s cubic-bezier(0.22, 1, 0.36, 1) backwards;
    }

    .overview-grid {
      display: grid;
      grid-template-columns: 110px 1fr;
      gap: 20px 24px;
      font-size: 1.05rem;
      line-height: 1.65;
      color: #374151;
    }
    .overview-label {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #6b7280;
      padding-top: 4px;
    }

    .entry-list {
      display: flex;
      flex-direction: column;
      gap: 28px;
    }
    .entry-item {
      padding-left: 18px;
      border-left: 2px solid #d1d5db;
      transition: border-color 0.2s ease, transform 0.2s ease;
    }
    .entry-item:hover {
      border-left-color: #7c3aed;
      transform: translateX(4px);
    }
    .entry-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 6px;
    }
    .entry-role {
      font-size: 1.12rem;
      font-weight: 600;
      color: #111827;
    }
    .entry-tag {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.78rem;
      color: #7c3aed;
      background: #ede9fe;
      padding: 2px 8px;
      border-radius: 4px;
    }
    .entry-desc {
      margin: 0;
      font-size: 0.96rem;
      line-height: 1.6;
      color: #4b5563;
    }

    .project-list {
      display: flex;
      flex-direction: column;
      gap: 32px;
    }
    .project-row {
      display: grid;
      grid-template-columns: 230px 1fr;
      gap: 24px;
      padding-bottom: 32px;
      border-bottom: 1px solid #e5e7eb;
      transition: transform 0.2s ease;
    }
    .project-row:hover {
      transform: translateX(4px);
    }
    .project-row:last-child { border-bottom: none; }
    .project-thumb {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
      background: #e5e7eb;
    }
    .project-info h3 {
      margin: 0 0 8px 0;
      font-size: 1.2rem;
      color: #111827;
    }
    .project-info p {
      margin: 0 0 16px 0;
      font-size: 0.95rem;
      line-height: 1.55;
      color: #4b5563;
    }
    .project-links {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .link-pill {
      display: inline-flex;
      align-items: center;
      padding: 6px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      border-radius: 6px;
      transition: all 0.15s ease;
    }
    .link-pill--secondary { color: #1f2937; background: #e5e7eb; }
    .link-pill--secondary:hover { background: #d1d5db; }
    .link-pill--primary { color: #ffffff; background: #7c3aed; }
    .link-pill--primary:hover { background: #6d28d9; }

    @media (max-width: 820px) {
      .glass-icons-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 56px 36px;
      }
      .workspace-layout { grid-template-columns: 1fr; gap: 28px; }
      .sidebar-column { position: static; }
      .project-row { grid-template-columns: 1fr; }
      .home-hero { height: 115px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useEffect, useRef, useState, useCallback } = React;

    /* --- TechText Component --- */
    const LABEL_FONT = '10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
    const SPRING = 320;
    const INHERIT = /^(currentcolor|inherit)$/i;
    const INTRO_DELAY = 0.15;
    const KICK_DECAY = 0.62;

    const approach = (current, target, dt, seconds) => current + (target - current) * (1 - Math.exp(-dt / seconds));
    const clamp01 = value => Math.min(1, Math.max(0, Number(value) || 0));
    const smoothstep = (edge0, edge1, value) => {
      const t = clamp01((value - edge0) / (edge1 - edge0));
      return t * t * (3 - 2 * t);
    };
    const noise = (...values) => {
      let h = 2166136261;
      for (const value of values) {
        h = Math.imul(h ^ (value | 0), 16777619);
        h ^= h >>> 13;
        h = Math.imul(h, 0x5bd1e995);
        h ^= h >>> 15;
      }
      return (h >>> 0) / 4294967296;
    };
    const signed = value => (value > 0 ? `+${value}` : value < 0 ? `−${-value}` : '0');

    const TechText = ({
      text = "Alankritha's Portfolio", fontFamily = '', fontWeight = 700, fontSize = 72, letterSpacing = -0.04,
      color = '#111827', accentColor = '#7c3aed', align = 'center',
      dashLength = 4, dashGap = 2, strokeWidth = 1.5, lineStyle = 'dashed', reveal = 'letter', specks = 15,
      selection = true, labels = true, draggable = true, bounce = 0.4, sweep = true, speed = 1,
      clickKick = true, intro = 'metrics', introDuration = 1.6, className = '', style
    }) => {
      const containerRef = useRef(null);
      const canvasRef = useRef(null);
      const settingsRef = useRef(null);
      const wakeRef = useRef(() => {});

      useEffect(() => {
        settingsRef.current = {
          text, fontFamily, fontWeight, fontSize, letterSpacing, color, accentColor, align,
          dashLength, dashGap, strokeWidth, lineStyle, reveal, specks, selection, labels, draggable, bounce,
          sweep, speed, clickKick, intro, introDuration
        };
        wakeRef.current();
      });

      useEffect(() => {
        const container = containerRef.current;
        const canvas = canvasRef.current;
        const ctx = canvas?.getContext('2d');
        const scratch = document.createElement('canvas');
        const scratchCtx = scratch.getContext('2d');
        if (!container || !canvas || !ctx || !scratchCtx) return undefined;

        const reducedMotion = window.matchMedia?.('(prefers-reduced-motion: reduce)')?.matches;
        let width = 1, height = 1, dpr = 1, raf = 0, last = performance.now(), visible = false, alive = true;
        let layoutKey = '', sizeDirty = true, requestedFont = '', word = null, glyphs = [];
        let clock = 0, pulse = 0, placed = false, dragging = -1, introClock = 0, introKind = '';
        let introducing = false, fontsReady = !document.fonts;
        const kicks = [], press = { x: 0, y: 0, time: 0, index: -1 }, pointer = { x: 0, y: 0, inside: false };
        const grab = { x: 0, y: 0 }, lens = { x: 0, y: 0 }, frame = { x1: 0, y1: 0, x2: 0, y2: 0, alpha: 0, index: -1 };

        const refreshFonts = () => { layoutKey = ''; wakeRef.current(); };
        const fontsLoaded = () => { fontsReady = true; refreshFonts(); };
        const family = s => s.fontFamily || getComputedStyle(container).fontFamily || 'sans-serif';
        const fontFor = (s, size) => `${s.fontWeight} ${size}px ${family(s)}`;
        const palette = s => {
          const current = getComputedStyle(container).color || '#000000';
          const pick = value => (!value || INHERIT.test(String(value).trim()) ? current : value);
          return { ink: pick(s.color), accent: pick(s.accentColor) };
        };
        const setFont = (target, s, size) => {
          target.font = fontFor(s, size);
          if ('letterSpacing' in target) target.letterSpacing = `${s.letterSpacing * size}px`;
          target.textAlign = 'left';
          target.textBaseline = 'alphabetic';
        };
        const sprite = (s, view, glyph, stroke, ink) => {
          const pad = Math.ceil(s.strokeWidth * 2 + 4);
          const left = glyph.box.x1 - pad, top = glyph.box.y1 - pad;
          const w = glyph.box.x2 - glyph.box.x1 + pad * 2, h = glyph.box.y2 - glyph.box.y1 + pad * 2;
          const image = document.createElement('canvas');
          image.width = Math.max(1, Math.ceil(w * dpr));
          image.height = Math.max(1, Math.ceil(h * dpr));
          const c = image.getContext('2d');
          if (!c) return { image, left, top };
          c.setTransform(dpr, 0, 0, dpr, -left * dpr, -top * dpr);
          setFont(c, s, view.size);
          if (stroke) {
            c.lineJoin = 'round'; c.lineWidth = s.strokeWidth * 2; c.lineCap = 'butt'; c.strokeStyle = ink;
            if (s.lineStyle !== 'solid') c.setLineDash([Math.max(1, s.dashLength), Math.max(1, s.dashGap)]);
            c.strokeText(glyph.char, glyph.x, view.baseline);
            c.setLineDash([]);
            c.globalCompositeOperation = 'destination-out'; c.fillStyle = '#000000';
            c.fillText(glyph.char, glyph.x, view.baseline);
            c.globalCompositeOperation = 'source-over';
          } else {
            c.fillStyle = ink; c.fillText(glyph.char, glyph.x, view.baseline);
          }
          return { image, left, top };
        };

        const ensureLayout = (s, ink) => {
          const key = [s.text, family(s), s.fontWeight, s.fontSize, s.letterSpacing, s.align, ink, s.dashLength, s.dashGap, s.strokeWidth, s.lineStyle, width, height, dpr].join('|');
          if (key === layoutKey && word) return word;
          layoutKey = key;
          const wanted = fontFor(s, 64);
          if (document.fonts && wanted !== requestedFont) {
            requestedFont = wanted;
            document.fonts.load(wanted, s.text).then(refreshFonts, refreshFonts);
          }
          const probe = scratchCtx;
          setFont(probe, s, s.fontSize);
          let m = probe.measureText(s.text);
          const fit = Math.min(1, (width * 0.9) / Math.max(m.actualBoundingBoxLeft + m.actualBoundingBoxRight, 1), (height * 0.66) / Math.max(m.actualBoundingBoxAscent + m.actualBoundingBoxDescent, 1));
          const size = s.fontSize * fit;
          setFont(probe, s, size);
          m = probe.measureText(s.text);
          const inkWidth = m.actualBoundingBoxLeft + m.actualBoundingBoxRight;
          const inkHeight = m.actualBoundingBoxAscent + m.actualBoundingBoxDescent;
          const margin = width * 0.05;
          const start = s.align === 'left' ? margin : s.align === 'right' ? width - margin - inkWidth : (width - inkWidth) / 2;
          const x = start + m.actualBoundingBoxLeft;
          const baseline = (height - inkHeight) / 2 + m.actualBoundingBoxAscent;
          const xHeight = baseline - probe.measureText('x').actualBoundingBoxAscent;
          const capHeight = baseline - probe.measureText('H').actualBoundingBoxAscent;
          const ascender = baseline - probe.measureText('d').actualBoundingBoxAscent;
          const descender = baseline + probe.measureText('p').actualBoundingBoxDescent;
          const top = baseline - m.actualBoundingBoxAscent;
          const bottom = baseline + m.actualBoundingBoxDescent;
          const inkTop = Math.min(top, capHeight) - 2;
          const inkBottom = Math.max(bottom, baseline) + 2;
          const next = {
            size, baseline, left: x - m.actualBoundingBoxLeft, right: x + m.actualBoundingBoxRight, top, bottom,
            lines: [
              { y: baseline, label: 'baseline' }, { y: xHeight, label: 'x-height' }, { y: capHeight, label: 'cap height' },
              ...(capHeight - ascender > Math.max(11, size * 0.06) ? [{ y: ascender, label: 'ascender' }] : []),
              { y: descender, label: 'descender' }
            ],
            bands: [
              { y0: xHeight, y1: baseline, up: true, order: 0 }, { y0: capHeight, y1: xHeight, up: true, order: 1 },
              { y0: inkTop, y1: capHeight, up: true, order: 2 }, { y0: baseline, y1: inkBottom, up: false, order: 1 }
            ].filter(band => band.y1 - band.y0 > 0.5)
          };
          word = next;
          const chars = Array.from(s.text), previous = glyphs;
          glyphs = [];
          let prefix = '';
          chars.forEach((char, i) => {
            prefix += char;
            const own = probe.measureText(char);
            const gx = x + probe.measureText(prefix).width - own.width;
            if (!char.trim()) return;
            const base = {
              char, x: gx,
              box: { x1: gx - own.actualBoundingBoxLeft, y1: baseline - own.actualBoundingBoxAscent, x2: gx + own.actualBoundingBoxRight, y2: baseline + own.actualBoundingBoxDescent }
            };
            const kept = previous[glyphs.length];
            const sameGlyph = kept?.char === char && kept.index === i;
            glyphs.push({
              ...base, offset: sameGlyph ? kept.offset : { x: 0, y: 0 }, velocity: sameGlyph ? kept.velocity : { x: 0, y: 0 },
              outline: sameGlyph ? kept.outline : 0, index: i,
              fill: sprite(s, next, base, false, ink), dashes: sprite(s, next, base, true, ink)
            });
          });
          if (dragging >= 0 && glyphs[dragging]?.index !== previous[dragging]?.index) dragging = -1;
          if (frame.index >= 0 && glyphs[frame.index]?.char !== previous[frame.index]?.char) frame.index = -1;
          return next;
        };

        const glyphAt = (x, y) => {
          if (!word || y < word.top - 24 || y > word.bottom + 24) return -1;
          let best = -1, bestDistance = Infinity;
          glyphs.forEach((glyph, i) => {
            const x1 = glyph.box.x1 + glyph.offset.x, x2 = glyph.box.x2 + glyph.offset.x;
            const d = x < x1 ? x1 - x : x > x2 ? x - x2 : 0;
            if (d < bestDistance) { bestDistance = d; best = i; }
          });
          return bestDistance < 28 ? best : -1;
        };

        const blit = (target, art, dx, dy, originX, originY) => {
          target.drawImage(art.image, Math.round((art.left + dx) * dpr - originX), Math.round((art.top + dy) * dpr - originY));
        };

        const crisp = value => (Math.round(value * dpr) + 0.5) / dpr;
        const perimeterPoint = (distance, w, h) => {
          let d = ((distance % (2 * (w + h))) + 2 * (w + h)) % (2 * (w + h));
          if (d < w) return [frame.x1 + d, frame.y1, 0, -1]; d -= w;
          if (d < h) return [frame.x2, frame.y1 + d, 1, 0]; d -= h;
          if (d < w) return [frame.x2 - d, frame.y2, 0, 1]; d -= w;
          return [frame.x1, frame.y2 - d, -1, 0];
        };

        const drawSpecks = (s, a, accent) => {
          const w = frame.x2 - frame.x1, h = frame.y2 - frame.y1;
          if (w < 2 || h < 2) return;
          const perimeter = 2 * (w + h), seed = frame.index + 1, grid = 3;
          ctx.fillStyle = accent; ctx.strokeStyle = accent;
          for (let k = 0; k < s.specks; k++) {

      {
        role: 'NTU Women in Tech Mentorship Programme',
        desc: 'Learnt a lot as a mentee from a startup founder!'
      },
      {
        role: 'Financial Controller @ Hall 5 Orientation 2025',
        desc: 'great experience where i learnt to deal with real money (thousands of dollars) efficiently, whilst handling a lot of responsibility together with other EXCOs.'
      },
      {
        role: 'Student Ambassador @ NTU School of Physical & Mathematical Sciences',
        desc: 'represent SPMS in events and talk to potential newcomers about my course & how much i (tolerate) love it.'
      },
      {
        role: 'Violinist (in the making)',
        desc: "Learning the carnatic violin since 2024, in a way it's sort of helps me be disciplined and persevere through my screeching noises."
      }
    ];

    /* --- Main App --- */
    function App() {
      const [activeTab, setActiveTab] = useState(null);

      const iconItems = [
        { icon: <UserIcon />, color: 'blue', label: 'Overview', onClick: () => setActiveTab(0) },
        { icon: <BriefcaseIcon />, color: 'purple', label: 'Work Experience', onClick: () => setActiveTab(1) },
        { icon: <CodeIcon />, color: 'teal', label: 'Projects', onClick: () => setActiveTab(2) },
        { icon: <SparklesIcon />, color: 'orange', label: 'Side Quests', onClick: () => setActiveTab(3) }
      ];

      if (activeTab === null) {
        return (
          <div className="portfolio-shell">
            <main className="home-stage">
              <div className="home-hero">
                <TechText
                  text="Alankritha's Portfolio"
                  fontWeight={700}
                  fontSize={72}
                  color="#111827"
                  accentColor="#7c3aed"
                  reveal="letter"
                  intro="metrics"
                  introDuration={1.6}
                  clickKick
                />
              </div>
              <div className="home-hint">More about me below! Pick a section to explore :)</div>
              <GlassIcons items={iconItems} />
            </main>
          </div>
        );
      }

      return (
        <div className="portfolio-shell">
          <header className="compact-header">
            <TechText
              text="Alankritha's Portfolio"
              fontWeight={700}
              fontSize={52}
              color="#111827"
              accentColor="#7c3aed"
              reveal="letter"
              intro="none"
              clickKick
            />
          </header>

          <main className="workspace-layout">
            <aside className="sidebar-column">
              <button type="button" className="back-btn" onClick={() => setActiveTab(null)}>
                ← Back
              </button>

              <LineSidebar
                items={SECTIONS}
                activeIndex={activeTab}
                onItemClick={(index) => setActiveTab(index)}
              />
            </aside>

            <section className="content-column" key={activeTab}>
              <div className="section-header">
                <span className="section-index">0{activeTab + 1}</span>
                <h2 className="section-title">{SECTIONS[activeTab]}</h2>
              </div>

              {activeTab === 0 && (
                <div className="overview-grid">
                  <div className="overview-label animated-item" style={{ animationDelay: '0.04s' }}>Major</div>
                  <div className="animated-item" style={{ animationDelay: '0.08s' }}>
                    Mathematical Sciences (Concentration in Statistics)
                  </div>

                  <div className="overview-label animated-item" style={{ animationDelay: '0.12s' }}>Interests</div>
                  <div className="animated-item" style={{ animationDelay: '0.16s' }}>
                    Data Science & Analytics, Machine Learning, Artificial Intelligence. All of
                    these applied to solving real world stuff, in Finance, Health, Education,
                    Entertainment etc is something i'd love to do :)
                  </div>
                </div>
              )}

              {activeTab === 1 && (
                <div className="entry-list">
                  {WORK_EXPERIENCE.map((item, idx) => (
                    <div
                      key={item.role}
                      className="entry-item animated-item"
                      style={{ animationDelay: `${idx * 0.06}s` }}
                    >
                      <div className="entry-top">
                        <span className="entry-role">{item.role}</span>
                        {item.tag && <span className="entry-tag">{item.tag}</span>}
                      </div>
                      <p className="entry-desc">{item.desc}</p>
                    </div>
                  ))}
                </div>
              )}

              {activeTab === 2 && (
                <div className="project-list">
                  {PROJECTS.map((proj, idx) => (
                    <article
                      key={proj.title}
                      className="project-row animated-item"
                      style={{ animationDelay: `${idx * 0.07}s` }}
                    >
                      <img src={proj.img} alt={proj.title} className="project-thumb" />
                      <div className="project-info">
                        <h3>{proj.title}</h3>
                        <p>{proj.desc}</p>
                        <div className="project-links">
                          {proj.links.map(link => (
                            <a
                              key={link.label}
                              href={link.url}
                              target="_blank"
                              rel="noreferrer"
                              className={`link-pill ${link.primary ? 'link-pill--primary' : 'link-pill--secondary'}`}
                            >
                              {link.label}
                            </a>
                          ))}
                        </div>
                      </div>
                    </article>
                  ))}
                </div>
              )}

              {activeTab === 3 && (
                <div className="entry-list">
                  {SIDE_QUESTS.map((quest, idx) => (
                    <div
                      key={quest.role}
                      className="entry-item animated-item"
                      style={{ animationDelay: `${idx * 0.06}s` }}
                    >
                      <div className="entry-top">
                        <span className="entry-role">{quest.role}</span>
                      </div>
                      <p className="entry-desc">{quest.desc}</p>
                    </div>
                  ))}
                </div>
              )}
            </section>
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
